<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Sentiment Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main style="min-height:100vh;display:grid;place-items:center;padding:24px;">
        <section class="chart-container" style="width:min(440px,100%);">
            <h1 id="authTitle">Sign in</h1>
            <p id="authSubtitle">Access the sentiment analysis dashboard.</p>
            <form id="authForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" id="email" type="email" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" id="password" type="password" minlength="8" autocomplete="current-password" required>
                </div>
                <p id="authError" role="alert" style="min-height:24px;"></p>
                <button class="btn btn--primary" type="submit" id="submitBtn">Sign in</button>
            </form>
            <button class="btn btn--outline" type="button" id="toggleMode" style="margin-top:12px;width:100%;">Create an account</button>
        </section>
    </main>
    <script src="auth.js"></script>
</body>
</html>
